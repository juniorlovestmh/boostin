[project]
name = "boostin-pipeline"
version = "0.1.0"
description = "Local-only Dagster assets for Boostin's private data pipeline."
requires-python = ">=3.13,<3.14"
dependencies = [
    "dagster==1.13.15",
]

[dependency-groups]
dev = [
    "dagster-dg-cli==1.13.15",
    "dagster-webserver==1.13.15",
    "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boostin_pipeline"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "boostin_pipeline"
registry_modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
