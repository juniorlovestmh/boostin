name: Verify

on:
  pull_request:
  push:
    branches: [staging, main, "dev/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOOSTIN_ALLOW_MAIN_SSD_PIPELINE_ENV: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.31"
      - run: uv python install 3.13
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure pipeline temp directories
        run: |
          pipeline_run_key="${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}"
          printf 'BOOSTIN_PIPELINE_VENV=%s/boostin-pipeline-venv-%s\n' "$RUNNER_TEMP" "$pipeline_run_key" >> "$GITHUB_ENV"
          printf 'BOOSTIN_UV_CACHE_DIR=%s/boostin-uv-cache-%s\n' "$RUNNER_TEMP" "$pipeline_run_key" >> "$GITHUB_ENV"
      - run: pnpm validate
